<!DOCTYPE html>
<html>
  <head>
    <style>
      .container
      {
        display: flex;
        justify-content: center;
      }
      .center
      {
        width: 400px;
      }
      #input
      {
        width: 100%;
        height: 100px;
      }
      #results
      {
        width: 100%;
      }
      #results thead
      {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <script type='text/javascript'>
      var Module = { }
      window.stdoutCallback = () => {}
      Module["noInitialRun"] = true;
      Module["printErr"] = Module["print"] = (text) => { window.stdoutCallback(text); }
    </script>
    <script src="reveng.js" async></script>

    <div class="container">
      <div class="center">
        <textarea id="input"></textarea>
        <table id="results">
          <thead>
            <tr><th>Algorithm</th><th>Result</th> </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>

    <script type="text/javascript">
      const crcs = [
        "CRC-16/ARC",
        "CRC-16/AUG-CCITT",
        "CRC-16/BUYPASS",
        "CRC-16/CCITT-FALSE",
        "CRC-16/CDMA2000",
        "CRC-16/DDS-110",
        "CRC-16/DECT-R",
        "CRC-16/DECT-X",
        "CRC-16/DNP",
        "CRC-16/EN-13757",
        "CRC-16/GENIBUS",
        "CRC-16/KERMIT",
        "CRC-16/MAXIM",
        "CRC-16/MCRF4XX",
        "CRC-16/MODBUS",
        "CRC-16/RIELLO",
        "CRC-16/T10-DIF",
        "CRC-16/TELEDISK",
        "CRC-16/TMS37157",
        "CRC-16/USB",
        "CRC-16/X-25",
        "CRC-16/XMODEM",
        "CRC-A"
      ];

      /* in C it would be `uint8_t x = ...; return 0-x;` */
      const zeroMinusX = (x) => (((~x) & 0xFF)+1)&0xFF
      const checksums =
      {
          "CS0": (arr) => arr.reduce((acc, cur) => acc + cur) & 0xFF,
          "CS1": (arr) => zeroMinusX(arr.reduce((acc, cur) => acc + cur) & 0xFF),
          "CS2": (arr) => arr.reduce((acc, cur) => acc ^ cur) ^ 0xFF,
          "CS3": (arr) => (((arr.reduce((acc, cur) => acc + cur) & 0xFF) ^ 0xFF) + 1) & 0xFF,
          "CS4": (arr) => arr.reduce((acc, cur) => acc ^ cur),
          "CS5": (arr) => (~arr.reduce((acc, cur) => acc ^ cur)) & 0xFF
      };

      let html = "";

      crcs.forEach((model) => html += `<tr><td>${model}</td><td id="${model}"></td></tr>`);
      Object.entries(checksums).forEach(([model, impl]) => html += `<tr><td>${model}</td><td id="${model}"></td></tr>`);

      document.getElementsByTagName("tbody")[0].innerHTML = html;

      const fromHexString = (hexString) =>
          Uint8Array.from(hexString.match(/.{1,2}/g).map((byte) => parseInt(byte, 16)));

      const toHexString = (bytes) =>
          bytes.reduce((str, byte) => str + byte.toString(16).padStart(2, '0'), '');

      const isHex = (maybeHex) =>
          maybeHex.length !== 0 && maybeHex.length % 2 === 0 && !/[^a-fA-F0-9]/u.test(maybeHex);

      const calccrc = (model, data, callback) =>
      {
          window.stdoutCallback = callback
          Module.ccall("calccrc", "number", ["string", "string"], [model, data])
      }

      const calccs = (model, arr, callback) =>
          callback(checksums[model](arr).toString(16).padStart(2, '0'))

      document.getElementById("input").onkeyup = () =>
      {
          const data = document.getElementById("input").value.replace(/\s/g,'')
          const arr = fromHexString(data)

          const putResult = (result, model) => document.getElementById(model).innerText = result.toUpperCase()
          if (isHex(data))
          {
              crcs.forEach((model) => calccrc(model, data, (result) => putResult(result, model)))
              Object.entries(checksums).forEach(([model, impl]) => calccs(model, arr, (result) => putResult(result, model)))
          }
      }
    </script>
  </body>
</html>
